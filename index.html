<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>גודל אמיתי</title>
<meta name="description" content="מסע בין גדלים, מחיידק ועד בורג׳ ח׳ליפה, עם תצוגת השוואה בקנה מידה אמיתי.">
<meta name="theme-color" content="#fbf6ec">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#card" id="skip"></a>
<div class="app" id="app">
  <header class="top">
    <h1 id="title"></h1>
    <div class="tools" role="toolbar" id="tools">
      <button class="ib" id="bList" type="button" aria-haspopup="dialog"></button>
      <button class="ib" id="bTour" type="button" aria-pressed="false"></button>
      <button class="ib" id="bRand" type="button"></button>
      <button class="ib" id="bCmp" type="button" aria-pressed="false"></button>
      <button class="ib" id="bInfo" type="button" aria-pressed="true"></button>
      <button class="ib lang" id="bLang" type="button"><span class="code" aria-hidden="true"></span></button>
    </div>
  </header>

  <main class="stage" id="stage" aria-roledescription="carousel">
    <div class="halo" aria-hidden="true"></div>
    <div class="art" id="art"><img id="img" alt="" draggable="false"></div>
    <div class="cmp" id="cmp" hidden>
      <div class="cmpground" id="cmpGround" aria-hidden="true"></div>
      <div class="fig" id="figA"><img alt="" draggable="false"><i class="dot" aria-hidden="true"></i><p class="cap"><b></b><small></small></p></div>
      <div class="fig" id="figB"><img alt="" draggable="false"><i class="dot" aria-hidden="true"></i><p class="cap"><b></b><small></small></p></div>
      <div class="mag" id="mag" hidden><img alt="" draggable="false"></div>
      <div class="magline" id="magLine" aria-hidden="true"></div>
      <p class="cmpratio" id="cmpRatio"></p>
      <div class="cmpbar" id="cmpBar"><i></i><b></b></div>
      <p class="cmpnote" id="cmpNote"></p>
      <div class="cmptools">
        <button class="ib" id="bPartner" type="button"></button>
        <button class="ib" id="bSwap" type="button"></button>
      </div>
    </div>
  </main>

  <section class="card" id="card" tabindex="-1" aria-labelledby="name">
    <p class="kind" id="kind"></p>
    <h2 id="name"></h2>
    <p class="size"><span id="size"></span></p>
    <div class="chips" id="chips"></div>
    <p class="fact" id="fact"></p>
    <a class="src" id="src" target="_blank" rel="noopener noreferrer"></a>
  </section>

  <div class="ruler" id="ruler" aria-hidden="true"><div class="line"></div></div>

  <nav class="nav" id="nav">
    <button class="ib" id="bFirst" type="button"></button>
    <button class="ib big" id="bPrev" type="button"></button>
    <span class="count" id="count" aria-hidden="true"></span>
    <button class="ib big" id="bNext" type="button"></button>
    <button class="ib" id="bLast" type="button"></button>
  </nav>
  <footer class="credit" id="credit"></footer>
</div>

<dialog id="dlg" aria-labelledby="dlgT">
  <div class="dhead"><h2 id="dlgT"></h2><button class="ib" id="bClose" type="button"></button></div>
  <ol id="list"></ol>
</dialog>
<div class="sr" id="live" aria-live="polite" role="status"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
